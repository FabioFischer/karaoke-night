[project]
name = "stage"
version = "0.1.0"
description = "Stage: local server, library, REAPER bridge and session."
requires-python = ">=3.12"
dependencies = [
    "core",
    "httpx2>=2.16.0",
]

[project.scripts]
stage = "stage.cli:main"

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
