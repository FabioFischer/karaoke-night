[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# rmvpe-onnx asks for onnxruntime (CPU), while audio-separator[gpu] brings
# onnxruntime-gpu. Both install the same onnxruntime module and break each
# other, so on Windows and Linux onnxruntime-gpu alone provides it.
override-dependencies = [
    "onnxruntime>=1.24; sys_platform != 'win32' and sys_platform != 'linux'",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
